# LTRtrace's environment: mamba env create -f environment.yml, then, in this checkout, pip install --no-deps -e .
name: ltrtrace
channels: [conda-forge, bioconda, nodefaults]   # nodefaults: no Anaconda commercial channel
dependencies:
  - python=3.12.16
  - numpy=2.5.4
  - numba=0.68.1
  - scipy=1.18.1
  - matplotlib-base=3.11.2  # figures, drawn without a display
  - pysam=0.24.1            # indexed FASTA and BAM, bgzip, tabix
  - mappy=2.31              # minimap2's Python binding
  - minimap2=2.31           # ltrtrace source; genotype builds its anchor index with it when present (else mappy)
  - python-edlib=1.3.9.post1
  - parasail-python=1.3.4
  - lastz=1.04.60           # genotype and geneflow on assemblies, geneflow --identity
  - msprime=1.4.2           # ltrtrace sim pop (pip extra sim)
  - tskit=1.0.4
  - samtools=1.24           # tests and the quick start: align the toy reads
  - bcftools=1.24           # tests; bcftools 1.25 cannot coexist with msprime (gsl)
  - poppler                 # tests: pdftoppm renders PDF figures to PNG for checking
  - pytest=9.2.0
  - ruff=0.17.4
  - pip
