name: ltrharvest4
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # --- LTR detection ---
  - genometools-genometools=1.6.6   # gt suffixerator / ltrharvest
  - ltr_finder=1.07
  - bedtools=2.31.1
  # --- clustering / alignment (Kmer2LTR, TEsorter2) ---
  - mmseqs2=16.747c6
  - mafft=7.526
  - trimal=1.5.1
  - hmmer=3.4                       # hmmsearch/nhmmer (TEsorter2)
  - blast                           # blastn/makeblastdb (flag_fp_families; TEsorter2 blast pass-2)
  - minimap2                        # TEsorter2 minimap2 pass-2 (PATH lookup); fallback for tools build
  - miniprot                        # protein mapping; fallback if source build fails
  # --- python libraries ---
  - biopython
  - numpy
  - matplotlib-base
  - networkx                        # Kmer2LTR ltr_family_network
  - pyfaidx                         # Kmer2LTR flag_fp_families
  - pyhmmer>=0.10                   # TEsorter2
  - pyfastx                         # TEsorter2
